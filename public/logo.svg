<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0a0a0a"/>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="grad1" x1="80" y1="160" x2="432" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background glow circle -->
  <circle cx="256" cy="220" r="160" fill="url(#grad2)"/>

  <!-- Shield / chip shape -->
  <path d="M256 100 L380 155 L380 270 Q380 350 256 400 Q132 350 132 270 L132 155 Z"
        fill="none" stroke="url(#grad1)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner chip lines -->
  <path d="M256 130 L356 175 L356 268 Q356 330 256 372 Q156 330 156 268 L156 175 Z"
        fill="none" stroke="url(#grad1)" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round"/>

  <!-- "5" numeral -->
  <text x="256" y="295" font-family="Arial Black, sans-serif" font-size="140" font-weight="900"
        text-anchor="middle" fill="url(#grad1)">5</text>

  <!-- "DLSS" label -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="52" font-weight="700"
        text-anchor="middle" letter-spacing="12" fill="white" opacity="0.9">DLSS</text>

  <!-- Dot indicator -->
  <circle cx="256" cy="490" r="5" fill="#4ade80" opacity="0.8"/>
</svg>
